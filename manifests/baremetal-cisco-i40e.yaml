# Tuned CR: baremetal-cisco-i40e
# Target: Cisco UCS C220 M5SX with Intel X710-DA4 (i40e driver)
# Priority: 11
# Match: nodes labeled node.kubernetes.io/nic-driver=i40e
# Status: DESIGNED — not deployed yet (waiting for hardware)
#
# Key settings:
#   - Ring buffers 4096: prevent hardware drops
#   - 16 combined queues: one per NUMA core (TODO: verify NUMA topology)
#   - Fixed coalescing 125us: predictable latency (Intel recommends disabling adaptive)
#   - ntuple on: Intel Flow Director for per-flow CPU steering
#   - netdev_max_backlog=5000: prevent softnet_drops at 10GbE
#   - THP=never: standard for workers
#
# NOTE: tcp_rmem is left at RHEL default — i40e is NOT affected by RHEL-97545 regression
---
apiVersion: tuned.openshift.io/v1
kind: Tuned
metadata:
  name: baremetal-cisco-i40e
  namespace: openshift-cluster-node-tuning-operator
spec:
  profile:
    - name: baremetal-cisco-i40e
      data: |
        [main]
        summary=Cisco C220 M5SX (i40e): ring 4096, 16 queues, ntuple, backlog 5000, THP never
        include=openshift-node

        [vm]
        transparent_hugepages=never

        [sysctl]
        kernel.printk = 4 4 1 7
        net.core.netdev_budget = 600
        net.core.netdev_budget_usecs = 4000
        net.core.netdev_max_backlog = 5000
        net.core.wmem_max = 16777216
        net.core.rmem_max = 16777216
        # Default tcp_rmem — i40e auto-tuning works correctly (not affected by RHEL-97545)
        net.ipv4.tcp_rmem = 4096 131072 16777216
        net.ipv4.tcp_wmem = 4096 131072 16777216

        [net]
        type=net
        devices_udev_regex=^ID_NET_DRIVER=i40e
        # Max ring buffers to prevent hardware drops under burst traffic
        ring=rx 4096 tx 4096
        # TODO: verify cores per NUMA on C220 M5SX before deploying
        # Intel doc 334019: queues must not exceed cores per NUMA node
        channels=combined 16
        # Intel recommends fixed coalescing (disable adaptive) for consistent latency
        coalesce=adaptive-rx off adaptive-tx off rx-usecs 125
        # Intel Flow Director: steers flows to the CPU running the receiving application
        features=ntuple on
  recommend:
    - match:
        # Custom label — must be applied manually:
        #   oc label node <name> node.kubernetes.io/nic-driver=i40e
        - label: node.kubernetes.io/nic-driver
          value: i40e
      # Priority 11 — after enic (10), before VM profiles (15+)
      priority: 11
      profile: baremetal-cisco-i40e
